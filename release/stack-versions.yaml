apiVersion: acornops.dev/v1alpha1
kind: StackVersionMatrix
metadata:
  name: acornops-stack
  updatedAt: "2026-08-09"

stacks:
  - name: local-dev
    description: Local full-stack source-mounted development profile.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    components:
      platformAdminConsole: acornops/platform-admin-console:local
      managementConsole: acornops/management-console:local
      controlPlane: acornops/control-plane:local
      executionEngine: acornops/execution-engine:local
      llmGateway: acornops/llm-gateway:local
      agentK: acornops/agentk:local
      agentV: acornops/agentv:local

  - name: vm-prod-v1
    description: Pinned greenfield Docker-on-VM production stack.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    components:
      managementConsole: ghcr.io/acornops/management-console:0.0.1-experimental.35
      controlPlane: ghcr.io/acornops/control-plane:0.0.1-experimental.34
      executionEngine: ghcr.io/acornops/execution-engine:0.0.1-experimental.14
      llmGateway: ghcr.io/acornops/llm-gateway:0.0.1-experimental.18
      agentV: https://github.com/acornops/agentv/releases/tag/v0.0.1-experimental.6

  - name: k8s-platform-v1
    description: Pinned greenfield Kubernetes stack deployed with the acornops-platform Helm chart.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    chart:
      acornopsPlatform: oci://ghcr.io/acornops/charts/acornops-platform:0.0.1-experimental.23
      acornopsAgentK: oci://ghcr.io/acornops/charts/acornops-agentk:0.0.1-experimental.13
    components:
      platformAdminConsole: ghcr.io/acornops/platform-admin-console:0.0.1-experimental.5
      managementConsole: ghcr.io/acornops/management-console:0.0.1-experimental.35
      controlPlane: ghcr.io/acornops/control-plane:0.0.1-experimental.34
      executionEngine: ghcr.io/acornops/execution-engine:0.0.1-experimental.14
      llmGateway: ghcr.io/acornops/llm-gateway:0.0.1-experimental.18
      agentV: https://github.com/acornops/agentv/releases/tag/v0.0.1-experimental.6

compatibility:
  notes:
    - AgentV v0.0.1-experimental.6 requires control-plane v0.0.1-experimental.34 and management-console v0.0.1-experimental.35; publish both images before releasing platform chart v0.0.1-experimental.23.
    - Deploy control-plane, execution-engine, and llm-gateway only as one pinned matrix with execution contract version 2.
    - Fresh installations start with empty databases; only a verified pre-greenfield epoch requires an explicitly approved destructive reset of both application databases.
    - Existing greenfield-1 databases use pending forward migrations with matching control-plane 001_initial_schema.sql checksums and gateway ancestry rooted at a10047518e6a; unknown or divergent history must be reconciled before deployment.
    - Crossing control-plane 006 or gateway b20058629f4b/c3006973a8d2 requires the coordinated MCP maintenance procedure in docs/OPERATIONS.md, including individual credential reconnects and its database/secret restore rollback boundary; it is not a rolling upgrade.
    - Hosted-readiness control-plane migrations 007-012 are additive; follow docs/hosted-readiness.md for quiesced activation and rollback. Existing pinned images do not certify inclusion of unreleased source changes.
    - Rehearse upgrades on a representative backup and verify image provenance before release approval; this matrix does not declare an unverified supported source-image version range.
    - Treat this matrix as release source-of-truth for docs and deployment examples.
