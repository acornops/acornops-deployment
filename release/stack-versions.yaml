apiVersion: acornops.dev/v1alpha1
kind: StackVersionMatrix
metadata:
  name: acornops-stack
  updatedAt: "2026-08-03"

stacks:
  - name: local-dev
    description: Local full-stack source-mounted development profile.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    components:
      platformAdminConsole: acornops/platform-admin-console:local
      managementConsole: acornops/management-console:local
      controlPlane: acornops/control-plane:local
      executionEngine: acornops/execution-engine:local
      llmGateway: acornops/llm-gateway:local
      agentK: acornops/agentk:local

  - name: vm-prod-v1
    description: Pinned greenfield Docker-on-VM production stack.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    components:
      managementConsole: ghcr.io/acornops/management-console:0.0.1-experimental.32
      controlPlane: ghcr.io/acornops/control-plane:0.0.1-experimental.31
      executionEngine: ghcr.io/acornops/execution-engine:0.0.1-experimental.13
      llmGateway: ghcr.io/acornops/llm-gateway:0.0.1-experimental.17

  - name: k8s-platform-v1
    description: Pinned greenfield Kubernetes stack deployed with the acornops-platform Helm chart.
    executionContractVersion: 2
    databaseSchemaEpoch: greenfield-1
    chart:
      acornopsPlatform: oci://ghcr.io/acornops/charts/acornops-platform:0.0.1-experimental.21
      acornopsAgentK: oci://ghcr.io/acornops/charts/acornops-agentk:0.0.1-experimental.13
    components:
      platformAdminConsole: ghcr.io/acornops/platform-admin-console:0.0.1-experimental.4
      managementConsole: ghcr.io/acornops/management-console:0.0.1-experimental.32
      controlPlane: ghcr.io/acornops/control-plane:0.0.1-experimental.31
      executionEngine: ghcr.io/acornops/execution-engine:0.0.1-experimental.13
      llmGateway: ghcr.io/acornops/llm-gateway:0.0.1-experimental.17

compatibility:
  notes:
    - Deploy control-plane, execution-engine, and llm-gateway only as one pinned matrix with execution contract version 2.
    - This greenfield schema epoch is a first-install or explicit-reset cutover, not a rolling upgrade.
    - Back up if needed, then explicitly drop and recreate both external application databases.
    - Treat this matrix as release source-of-truth for docs and deployment examples.
